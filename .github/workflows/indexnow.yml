name: IndexNow submit

on:
  schedule:
    # Daily at 04:00 UTC, after the 02:00 squad sync
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit sitemap URLs to IndexNow
        run: npx --yes tsx scripts/indexnow-submit.ts
